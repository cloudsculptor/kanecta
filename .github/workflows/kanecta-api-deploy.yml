name: Deploy Kanecta API + Studio

# Deploys the kanecta-api backend (and the Studio SPA) to one or all of the
# per-instance stacks on the remutaka droplet. Each instance runs its own
# pm2 process bound to 127.0.0.1 on its own port, reading its own
# /opt/kanecta-<dir>/config (config.json + .env — NOT in the repo, never touched
# by deploy). Config/studio dirs are siblings of app/, so the app rsync leaves
# them alone.
#
# Manual by design (workflow_dispatch): prod is live, so a redeploy restarts a
# serving process — trigger it intentionally, not on every push.
# Pick a single instance or "all". (nonprod is deployed separately.)

on:
  workflow_dispatch:
    inputs:
      instance:
        description: Instance to deploy
        type: choice
        default: all
        options: [all, prod, internal, springfarm, organiser]
      deploy_studio:
        description: Also rebuild + deploy the Studio SPA
        type: boolean
        default: true

jobs:
  build-studio:
    if: ${{ inputs.deploy_studio }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Studio (auth-disabled, relative /api — backend-agnostic)
        run: |
          npm ci --workspace kanecta-ui/kanecta-apps/kanecta-app-studio
          VITE_AUTH_DISABLED=true npx --workspace kanecta-ui/kanecta-apps/kanecta-app-studio vite build
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: studio-dist
          path: kanecta-ui/kanecta-apps/kanecta-app-studio/dist/

  deploy:
    needs: [build-studio]
    # build-studio is skipped when deploy_studio=false; don't let that skip deploy.
    if: ${{ always() && (needs.build-studio.result == 'success' || needs.build-studio.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { instance: prod,       dir: kanecta-prod,       pm2: kanecta-api-prod,       port: 3101 }
          - { instance: internal,   dir: kanecta-internal,   pm2: kanecta-api-internal,   port: 3102 }
          - { instance: springfarm, dir: kanecta-springfarm, pm2: kanecta-api-springfarm, port: 3103 }
          - { instance: organiser,    dir: kanecta-organiser,    pm2: kanecta-api-organiser,    port: 3104 }
    steps:
      - name: Gate on selected instance
        id: gate
        run: |
          if [ "${{ inputs.instance }}" != "all" ] && [ "${{ inputs.instance }}" != "${{ matrix.instance }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - name: Configure SSH
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy kanecta-api
        if: steps.gate.outputs.run == 'true'
        run: |
          rsync -az --delete --exclude node_modules --exclude .git -e "ssh -i ~/.ssh/deploy_key" \
            ./ root@${{ secrets.DEPLOY_HOST }}:/opt/${{ matrix.dir }}/app/
          # Scoped install only — a full monorepo `npm ci` OOM-kills the 2GB box.
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/${{ matrix.dir }}/app && npm ci --workspace kanecta-core/kanecta-api && pm2 restart ${{ matrix.pm2 }} --update-env && pm2 save"

      - name: Deploy Studio
        if: ${{ steps.gate.outputs.run == 'true' && inputs.deploy_studio }}
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: studio-dist/

      - name: Push Studio dist
        if: ${{ steps.gate.outputs.run == 'true' && inputs.deploy_studio }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            studio-dist/ root@${{ secrets.DEPLOY_HOST }}:/opt/${{ matrix.dir }}/studio/

      - name: Smoke test (localhost /working-sets)
        if: steps.gate.outputs.run == 'true'
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key root@${{ secrets.DEPLOY_HOST }} \
            "curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' http://localhost:${{ matrix.port }}/working-sets"
